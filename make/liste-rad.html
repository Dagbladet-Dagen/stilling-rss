<!-- Dagen Stilling, MAKE RSS row: 1 older ad as a list line.
     Feed: eldre.xml (shortest deadline first). Antall 1; repeat with
     Forskyv 1, 2, 3 ... Each line closes the box below it. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F5F5;">
  <tr>
    <td style="padding:0 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FFFFFF;border-left:1px solid #E4E0DF;border-right:1px solid #E4E0DF;border-bottom:1px solid #E4E0DF;">
        <tr>
          <td style="padding:10px 14px 12px 14px;font-family:'Schibsted Grotesk',Helvetica,Arial,sans-serif;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="bottom" style="font-family:'Schibsted Grotesk',Helvetica,Arial,sans-serif;">
                  <div style="font-size:12px;line-height:16px;color:#6F676B;margin:0 0 2px 0;">{{RSS_ITEM1_AUTHOR}}</div>
                  <a href="{{RSS_ITEM1_URL}}" target="_blank" style="font-size:15px;line-height:20px;font-weight:700;color:#1A1618;text-decoration:none;">{{RSS_ITEM1_TITLE}}</a>
                </td>
                <td valign="bottom" align="right" style="font-family:'Schibsted Grotesk',Helvetica,Arial,sans-serif;font-size:12px;line-height:20px;font-weight:700;color:#1A1618;white-space:nowrap;padding-left:12px;">{{RSS_ITEM1_EXTRA2}}</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
