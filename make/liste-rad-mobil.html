<!-- Dagen Stilling, MAKE RSS element, mobile: 1 older ad, deadline under
     the title. Feed: eldre.xml, Antall 1; repeat with Forskyv 1, 2, 3 ...
     16 px side margin built in: set no side padding in MAKE. Show on mobile only. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
  <tr>
    <td style="padding:0 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#FFFFFF;border:1px solid #E4E0DF;border-radius:6px;border-collapse:separate;">
        <tr>
          <td align="left" style="text-align:left;padding:10px 14px 12px 14px;font-family:'Schibsted Grotesk',Helvetica,Arial,sans-serif;">
            <div style="font-size:12px;line-height:16px;color:#6F676B;margin:0 0 2px 0;">{{RSS_ITEM1_AUTHOR}}</div>
            <a href="{{RSS_ITEM1_URL}}" target="_blank" style="font-size:16px;line-height:21px;font-weight:700;color:#1A1618;text-decoration:none;">{{RSS_ITEM1_TITLE}}</a>
            <div style="font-size:12px;line-height:16px;font-weight:700;color:#1A1618;margin:4px 0 0 0;">{{RSS_ITEM1_EXTRA2}}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
