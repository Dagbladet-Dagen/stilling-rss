name: Feed

# The newsletter goes out Friday 09:00 Oslo time, and MAKE may build it up
# to two hours before. Every night, plus early Friday so ads published
# overnight are in. Cron is UTC and may start late; Oslo is UTC+1 in winter
# and UTC+2 in summer, so 04:30 UTC is 05:30 or 06:30 there.
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "30 4 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.deploy.outputs.page_url }}stillinger.xml
    steps:
      - uses: actions/checkout@v7

      - name: Build the feed
        run: python3 rss-feed.py --base https://dagbladet-dagen.github.io/stilling-rss/ && python3 preview.py

      # Committing when the ads change keeps a history, and keeps the repo
      # active: GitHub disables schedules after 60 days without activity.
      # The fresh feeds' pubDates change every run, so they are ignored here.
      - name: Commit if the ads changed
        run: |
          git add -A site
          if git diff --cached --quiet -I '<lastBuildDate>' -I '<pubDate>'; then
            git reset -q
            echo "No change in the ads."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Feed: $(grep -c '<item>' site/stillinger.xml) ads"
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # The Pages deploy fails now and then with "try again later" (twice on
      # 24.11.2026); a second try a minute later has always worked.
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
